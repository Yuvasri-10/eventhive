services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: ${DOCKERHUB_USERNAME}/eventhive:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      MONGO_URL: mongodb://mongo:27017/eventhive
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET on deployment host}
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
