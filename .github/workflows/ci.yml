name: EventHive CI
# Fast feedback on every push / PR. Image publishing and deployment
# are handled by Jenkins (see Jenkinsfile).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
      - name: Verify Docker image builds
        run: docker build -t eventhive:ci .
